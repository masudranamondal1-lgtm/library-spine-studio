<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — Spine Studio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4efe4; color: #22262e; margin: 0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #fffdf8; border: 1px solid #dcd4c2; border-radius: 14px;
      padding: 32px; max-width: 480px; width: 100%;
      box-shadow: 0 4px 16px rgba(34, 38, 46, 0.10);
      text-align: center;
    }
    h1 { font-family: Georgia, serif; font-size: 1.8rem; margin: 0 0 8px; color: #1a2332; }
    p { color: #6e7585; line-height: 1.6; margin: 0 0 20px; }
    img { width: 280px; height: 280px; border-radius: 12px; background: #fff; padding: 12px; border: 1px solid #dcd4c2; margin: 0 auto 16px; }
    code { display: inline-block; font-family: monospace; font-size: 1rem; background: #f8f3e8; border: 1px solid #dcd4c2; border-radius: 8px; padding: 10px 16px; color: #22262e; }
    .small { font-size: 0.85rem; color: #98a0ae; margin-top: 16px; }
    a { color: #253b6e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📖 Support Spine Studio</h1>
    <p>Scan this QR with GPay, PhonePe, Paytm, BHIM, or any UPI app.</p>
    <img src="upi-qr.png" alt="UPI QR code">
    <br>
    <code>masudranamandal-1@okicici</code>
    <p class="small">This app is free and open-source. Donations are completely optional.</p>
    <p class="small"><a href="./">← Back to Spine Studio</a></p>
  </div>
</body>
</html>
